name: Ops hygiene

# Size and shape checks for the operator's notes (ops/STATE.md <= 8 KB, QUEUE <= 15 items, live ops
# files <= 50 KB). Kept out of the Pages deploy so a long notes file never blocks the site; a failure
# here still emails the owner and must be fixed by the next run.
on:
  push:
    branches:
      - main
    paths:
      - "ops/**"
      - "tools/ops-state.test.mjs"
      - "tools/holds-due*.mjs"
      - "tools/runs-rollover.mjs"
      - ".github/workflows/ops-hygiene.yml"
  workflow_dispatch:
  schedule:
    # Daily, also catches bot commits made with GITHUB_TOKEN (they start no push workflows).
    - cron: "41 6 * * *"

permissions:
  contents: read
  actions: write   # to start a GSC snapshot when the scheduled one was skipped

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Early warnings (90% of size limits; GSC snapshot older than 4 days starts a new one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node tools/ops-headroom.mjs --stale-gsc-exit
          code=$?
          set -e
          if [ "$code" = 3 ]; then
            recent=$(gh run list -R "$GITHUB_REPOSITORY" -w gsc-snapshot.yml -L 1 --json createdAt -q '.[0].createdAt')
            if [ -z "$recent" ] || [ $(( $(date +%s) - $(date -d "$recent" +%s) )) -gt 21600 ]; then
              gh workflow run gsc-snapshot.yml -R "$GITHUB_REPOSITORY" && echo "started a GSC snapshot"
            else
              echo "a GSC snapshot run started within 6 hours; not starting another"
            fi
          fi
      - name: Ops state and size checks
        run: node --test --test-reporter=dot tools/ops-state.test.mjs tools/holds-due.test.mjs
