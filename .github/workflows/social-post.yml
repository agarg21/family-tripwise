name: Social posting

# Posts due entries of today's ops/social-queue file (QUEUE G04, OWNER D12), platform by platform,
# only for platforms whose secrets exist. tools/social-post.mjs checks the D12 kill switch on the
# latest main before every post, claims a receipt on main (fast-forward only) before posting so
# nothing posts twice, never posts an expired entry, and keeps per-platform daily caps.
# Manual runs default to a dry run against simulated platforms (no secrets, no commits).
# With the ZERNIO_API_KEY secret, all platforms post through Zernio (QUEUE G08, OWNER D14) to the
# accounts connected there; without it, the direct Meta/Pinterest secrets are used.

on:
  schedule:
    # Slots are 07:30, 10:00, 12:30, 15:00, 17:30 and 19:30 America/New_York. These minutes cover
    # both EDT (UTC-4) and EST (UTC-5); a run with nothing due exits without committing.
    - cron: "40 11,12,14,15,16,17,19,20,21,22,23 * * *"
    - cron: "40 0 * * *"
  # GitHub drops many scheduled runs (2 of 12 fired on 2026-11-01). The hourly operator commits
  # ops/STATE.md on main almost every hour (claim and unlock), so each of those pushes also starts a
  # posting run. Only the operator's hourly "ops: claim run" commit starts one (job `if` below); its other
  # STATE commits in the same hour skip at no cost (was ~45 runs a day, now ~24). Receipt commits made by this workflow touch only ops/social-receipts and use
  # GITHUB_TOKEN, so they never retrigger it; the concurrency group keeps runs one at a time.
  push:
    branches: [main]
    paths: ["ops/STATE.md"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulated platforms only (no posting, no commits)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'ops: claim run')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate posting tool and queues
        run: node --test tools/social-post.test.mjs tools/social-queue.test.mjs

      - name: Dry run (simulated platforms)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: node tools/social-post.mjs --dry-run --receipts-out "$RUNNER_TEMP/dry-run"

      - name: Post due entries
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: |
          git config user.name "family-tripwise-operator"
          git config user.email "family-tripwise-operator@users.noreply.github.com"
          node tools/social-post.mjs

      - name: Upload receipts as a backup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dry-run/
            ops/social-receipts/
          if-no-files-found: ignore
          retention-days: 30
